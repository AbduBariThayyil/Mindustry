name: Build Mindustry IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry

      - name: Checkout Arc (Full History)
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          fetch-depth: 0

      - name: Switch to exact Arc commit
        run: |
          git checkout 208a754044
          git submodule update --init --recursive
        working-directory: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew
        working-directory: Mindustry

      - name: Fix Legacy iOS Pathing & Frameworks
        run: |
          mkdir -p ios/libs
          mkdir -p ../Arc/backends/backend-robovm/src/META-INF/robovm/ios/libs
          
          # 1. Fix the missing .a files 
          find ../Arc -name "*.a" -exec cp {} ios/libs/ \;
          
          # 2. Force download the missing MetalANGLEKit framework
          curl -L -o metal.zip https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip
          
          # 3. Extract it into both places RoboVM expects to see it
          unzip -o metal.zip -d ios/libs/
          unzip -o metal.zip -d ../Arc/backends/backend-robovm/src/META-INF/robovm/ios/libs/
        working-directory: Mindustry

      - name: Pack Natives
        run: ./gradlew pack
        working-directory: Mindustry

      - name: Compile IPA
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true
        working-directory: Mindustry

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-v159.7
          path: Mindustry/ios/build/robovm/*.ipa
