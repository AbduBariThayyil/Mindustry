name: Build Mindustry IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-laest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry
          lfs: true

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          fetch-depth: 0
          lfs: true

      - name: Switch to exact Arc commit
        run: |
          git checkout 208a754044
          git submodule update --init --recursive
        working-directory: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install C++ Build Tools
        run: brew install ant autoconf automake libtool pkg-config

      - name: Compile Arc iOS Natives
        run: |
          chmod +x ./gradlew
          ./gradlew jnigen jnigenBuildAllIOS
        working-directory: Arc

      - name: Inject MetalANGLE Framework
        run: |
          echo "1. Creating dedicated frameworks folder..."
          mkdir -p ios/frameworks
          
          echo "2. Downloading MetalANGLEKit..."
          curl -L -o metal.zip https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip
          
          echo "3. Extracting framework..."
          unzip -q -o metal.zip -d ios/frameworks/
          
          echo "4. Linking framework folder cleanly in robovm.xml..."
          sed -i.bak 's|</config>|  <frameworkPaths>\n    <path>frameworks</path>\n  </frameworkPaths>\n</config>|' ios/robovm.xml
        working-directory: Mindustry

      - name: Make Gradle Executable & Pack
        run: |
          chmod +x ./gradlew
          ./gradlew pack
        working-directory: Mindustry

      - name: Compile IPA
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true
        working-directory: Mindustry

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-v159.7
          path: Mindustry/ios/build/robovm/*.ipa
