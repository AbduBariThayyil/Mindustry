name: Build Mindustry IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject MetalANGLE Framework
        run: |
          echo "1. Creating dedicated frameworks folder..."
          mkdir -p ios/frameworks
          
          echo "2. Downloading MetalANGLEKit..."
          curl -L -o metal.zip https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip
          
          echo "3. Extracting framework..."
          unzip -q -o metal.zip -d ios/frameworks/
          
          echo "4. Linking framework folder cleanly in robovm.xml..."
          sed -i.bak 's|</config>|  <frameworkPaths>\n    <path>frameworks</path>\n  </frameworkPaths>\n</config>|' ios/robovm.xml
          
          echo "5. Verifying XML injection:"
          cat ios/robovm.xml | grep frameworkPaths -A 2

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Pack Natives (Using JitPack)
        run: ./gradlew pack -PnoLocalArc=true

      - name: Compile IPA (Using JitPack)
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true -PnoLocalArc=true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-v159.7
          path: ios/build/robovm/*.ipa
