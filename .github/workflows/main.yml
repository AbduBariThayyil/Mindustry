name: Build Mindustry IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry

      - name: Checkout Arc (Full History)
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          fetch-depth: 0

      - name: Switch to exact Arc commit
        run: |
          git checkout 208a754044
          git submodule update --init --recursive
        working-directory: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew
        working-directory: Mindustry

      - name: Pack Natives
        run: ./gradlew pack
        working-directory: Mindustry

      - name: Compile IPA
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true
        working-directory: Mindustry

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-v159.7
          path: Mindustry/ios/build/robovm/*.ipa
