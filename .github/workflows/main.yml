name: Build Mindustry IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry
          lfs: true

      - name: Checkout Arc (Full History)
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          fetch-depth: 0
          lfs: true

      - name: Switch to exact Arc commit
        run: |
          git checkout 208a754044
          git submodule update --init --recursive
        working-directory: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew
        working-directory: Mindustry

      - name: The Scalpel Hack (Native Framework Injection)
        run: |
          echo "1. Creating dedicated iOS library folder..."
          mkdir -p ios/libs
          
          echo "2. Securing static C++ libraries..."
          find ../Arc -name "*.a" -exec cp {} ios/libs/ \;
          
          echo "3. Downloading MetalANGLE framework directly into libs..."
          curl -L -o metal.zip https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip
          unzip -q -o metal.zip -d ios/libs/
          
          echo "4. Modifying RoboVM XML to natively read the new folder..."
          sed -i.bak 's|</config>|  <frameworkPaths>\n    <path>libs</path>\n  </frameworkPaths>\n</config>|' ios/robovm.xml
          
          echo "5. Verifying modification..."
          cat ios/robovm.xml | grep frameworkPaths -A 2
        working-directory: Mindustry

      - name: Pack Natives
        run: ./gradlew pack
        working-directory: Mindustry

      - name: Compile IPA
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true
        working-directory: Mindustry

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-v159.7
          path: Mindustry/ios/build/robovm/*.ipa
