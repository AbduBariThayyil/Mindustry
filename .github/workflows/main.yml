name: Build Mindustry IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew
        working-directory: Mindustry

      - name: Pack Dependencies
        run: ./gradlew pack
        working-directory: Mindustry

      - name: Compile IPA
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true
        working-directory: Mindustry

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS
          path: Mindustry/ios/build/robovm/*.ipa
